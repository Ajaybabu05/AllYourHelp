<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Service - AllYourHelp</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #374151;
            text-decoration: none;
            font-weight: 600;
        }

        h1 {
            margin-bottom: 25px;
            color: #111827;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            box-sizing: border-box;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .required {
            color: #dc2626;
        }

        .buttons {
            margin-top: 25px;
        }

        .submit-btn {
            border: none;
            background: #2563eb;
            color: white;
            padding: 12px 22px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        .cancel-btn {
            display: inline-block;
            margin-left: 10px;
            padding: 12px 22px;
            border-radius: 8px;
            background: #f3f4f6;
            color: #374151;
            text-decoration: none;
            font-weight: 600;
        }
        /* ==================== FLASH MESSAGES ==================== */

.flash-container {
    position: fixed;
    top: 25px;
    right: 25px;
    width: min(380px, calc(100% - 40px));
    z-index: 9999;
}

.flash {
    padding: 14px 18px;
    border-radius: 8px;
    margin-bottom: 10px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);

    opacity: 1;
    transform: translateY(0);

    transition:
        opacity 0.4s ease,
        transform 0.4s ease;
}

.flash.success {
    background: #dff5e5;
    color: #176b2c;
    border-left: 4px solid #22c55e;
}

.flash.error {
    background: #fde2e2;
    color: #a51d1d;
    border-left: 4px solid #ef4444;
}

.flash.warning {
    background: #fff4d6;
    color: #92400e;
    border-left: 4px solid #f59e0b;
}

.flash.info {
    background: #dbeafe;
    color: #1e40af;
    border-left: 4px solid #3b82f6;
}

.flash.hide {
    opacity: 0;
    transform: translateY(-10px);
}

@media (max-width: 600px) {

    .flash-container {
        top: 15px;
        right: 15px;
        width: calc(100% - 30px);
    }

}

    </style>

</head>

<body>

    {% include "includes/flash_messages.html" %}

<div class="container">

    <a
        href="{{ url_for('admin.services') }}"
        class="back-link"
    >
        ← Manage Services
    </a>

    <h1>Edit Service</h1>

    <form
        method="POST"
        action="{{ url_for('admin.edit_service', service_id=service.id) }}"
    >
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">

            <label for="name">
                Service Name
                <span class="required">*</span>
            </label>

            <input
                type="text"
                id="name"
                name="name"
                value="{{ service.name }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="slug">
                Service Slug
                <span class="required">*</span>
            </label>

            <input
                type="text"
                id="slug"
                name="slug"
                value="{{ service.slug }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="category_id">
                Category
                <span class="required">*</span>
            </label>

            <select
                id="category_id"
                name="category_id"
                required
            >

                {% for category in categories %}

                    <option
                        value="{{ category.id }}"
                        {% if category.id == service.category_id %}
                            selected
                        {% endif %}
                    >
                        {{ category.name }}
                    </option>

                {% endfor %}

            </select>

        </div>


        <div class="form-group">

            <label for="price">
                Price
                <span class="required">*</span>
            </label>

            <input
                type="number"
                id="price"
                name="price"
                min="0"
                step="0.01"
                value="{{ service.price }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                name="description"
            >{{ service.description or "" }}</textarea>

        </div>


        <div class="buttons">

            <button
                type="submit"
                class="submit-btn"
            >
                Save Changes
            </button>

            <a
                href="{{ url_for('admin.services') }}"
                class="cancel-btn"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

<script src="{{ url_for('static', filename='js/flash.js') }}"></script>

</body>

</html>
