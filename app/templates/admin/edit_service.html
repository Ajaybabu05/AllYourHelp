<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Service - AllYourHelp</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #374151;
            text-decoration: none;
            font-weight: 600;
        }

        h1 {
            margin-bottom: 25px;
            color: #111827;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            box-sizing: border-box;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .required {
            color: #dc2626;
        }

        .buttons {
            margin-top: 25px;
        }

        .submit-btn {
            border: none;
            background: #2563eb;
            color: white;
            padding: 12px 22px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        .cancel-btn {
            display: inline-block;
            margin-left: 10px;
            padding: 12px 22px;
            border-radius: 8px;
            background: #f3f4f6;
            color: #374151;
            text-decoration: none;
            font-weight: 600;
        }

    </style>

</head>

<body>

<div class="container">

    <a
        href="{{ url_for('admin.services') }}"
        class="back-link"
    >
        ← Manage Services
    </a>

    <h1>Edit Service</h1>

    <form
        method="POST"
        action="{{ url_for('admin.edit_service', service_id=service.id) }}"
    >

        <div class="form-group">

            <label for="name">
                Service Name
                <span class="required">*</span>
            </label>

            <input
                type="text"
                id="name"
                name="name"
                value="{{ service.name }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="slug">
                Service Slug
                <span class="required">*</span>
            </label>

            <input
                type="text"
                id="slug"
                name="slug"
                value="{{ service.slug }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="category_id">
                Category
                <span class="required">*</span>
            </label>

            <select
                id="category_id"
                name="category_id"
                required
            >

                {% for category in categories %}

                    <option
                        value="{{ category.id }}"
                        {% if category.id == service.category_id %}
                            selected
                        {% endif %}
                    >
                        {{ category.name }}
                    </option>

                {% endfor %}

            </select>

        </div>


        <div class="form-group">

            <label for="price">
                Price
                <span class="required">*</span>
            </label>

            <input
                type="number"
                id="price"
                name="price"
                min="0"
                step="0.01"
                value="{{ service.price }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                name="description"
            >{{ service.description or "" }}</textarea>

        </div>


        <div class="buttons">

            <button
                type="submit"
                class="submit-btn"
            >
                Save Changes
            </button>

            <a
                href="{{ url_for('admin.services') }}"
                class="cancel-btn"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

</body>

</html>
