<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Too Many Requests - AllYourHelp</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/errors.css') }}"
    >
</head>

<body>

    <div class="error-page">

        <div class="error-card">

            <div class="error-code">429</div>

            <h1>Too Many Requests</h1>

            <p>
                You've made too many requests in a short period of time.
                Please wait a little while and try again.
            </p>

            <div class="error-actions">

                <a href="{{ url_for('home') }}" class="error-btn primary-btn">
                    Go Home
                </a>

                <button
                    type="button"
                    class="error-btn secondary-btn"
                    onclick="history.back()"
                >
                    Go Back
                </button>

            </div>

        </div>

    </div>

</body>
</html>
