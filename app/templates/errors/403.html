<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - AllYourHelp</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/errors.css') }}">
</head>
<body>
    <main class="error-page">
        <div class="error-card">
            <div class="error-code">403</div>
            <h1>Access denied</h1>
            <p>You don't have permission to access this page. Please check your account or return to the home page.</p>
            <div class="error-actions">
                <a href="{{ url_for('home') }}" class="primary-btn">Go to Home</a>
                <button type="button" class="secondary-btn" onclick="history.back()">Go Back</button>
            </div>
        </div>
    </main>
</body>
</html>
