<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something Went Wrong - AllYourHelp</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/errors.css') }}">
</head>
<body>
    <main class="error-page">
        <div class="error-card">
            <div class="error-code">500</div>
            <h1>Something went wrong</h1>
            <p>We couldn't complete your request right now. Please try again in a moment.</p>
            <div class="error-actions">
                <a href="{{ url_for('home') }}" class="primary-btn">Go to Home</a>
                <button type="button" class="secondary-btn" onclick="location.reload()">Try Again</button>
            </div>
        </div>
    </main>
</body>
</html>
