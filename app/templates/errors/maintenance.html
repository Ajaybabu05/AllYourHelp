<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Maintenance - AllYourHelp
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f8fafc;
            color: #1f2937;
        }

        .maintenance-card {
            width: 100%;
            max-width: 600px;

            padding: 50px 40px;

            background: #ffffff;

            border-radius: 18px;

            text-align: center;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.08);
        }

        .maintenance-icon {
            width: 80px;
            height: 80px;

            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #fff3cd;
            color: #856404;

            font-size: 38px;
            font-weight: bold;
        }

        h1 {
            margin: 0 0 15px;

            font-size: 30px;
        }

        p {
            margin: 0;

            color: #6b7280;

            line-height: 1.7;

            font-size: 16px;
        }

        .brand {
            margin-top: 30px;

            font-size: 20px;
            font-weight: 700;

            color: #2563eb;
        }

        @media (max-width: 600px) {

            .maintenance-card {
                padding: 40px 25px;
            }

            h1 {
                font-size: 25px;
            }

            p {
                font-size: 15px;
            }

        }

    </style>

</head>

<body>

    <div class="maintenance-card">

        <div class="maintenance-icon">
            !
        </div>

        <h1>
            We'll be back soon
        </h1>

        <p>
            AllYourHelp is currently undergoing
            maintenance.
            <br>
            Please try again later.
        </p>

        <div class="brand">
            AllYourHelp
        </div>

    </div>

</body>

</html>
